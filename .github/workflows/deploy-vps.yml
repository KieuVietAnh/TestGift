name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tetgift-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image names
        id: images
        shell: bash
        run: |
          BASE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${BASE_IMAGE}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${BASE_IMAGE}-frontend" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./FE
          file: ./FE/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
            ${{ steps.images.outputs.frontend }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p ~/tetgift"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" docker-compose.prod.yml Caddyfile "$VPS_USER@$VPS_HOST:~/tetgift/"

      - name: Deploy and verify
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "TETGIFT_BE_IMAGE='$BACKEND_IMAGE:$IMAGE_TAG' TETGIFT_FE_IMAGE='$FRONTEND_IMAGE:$IMAGE_TAG' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd ~/tetgift

          if [ ! -f .env ]; then
            echo "Missing ~/tetgift/.env on VPS"
            exit 1
          fi

          printf 'TETGIFT_BE_IMAGE=%s\nTETGIFT_FE_IMAGE=%s\n' "$TETGIFT_BE_IMAGE" "$TETGIFT_FE_IMAGE" > image.env
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          docker compose --env-file .env --env-file image.env -f docker-compose.prod.yml config >/dev/null
          docker compose --env-file .env --env-file image.env -f docker-compose.prod.yml pull
          docker compose --env-file .env --env-file image.env -f docker-compose.prod.yml up -d --remove-orphans

          WEB_DOMAIN="$(grep -E '^WEB_DOMAIN=' .env | tail -n 1 | cut -d= -f2- | tr -d '\r')"
          if [ -z "$WEB_DOMAIN" ]; then
            echo "WEB_DOMAIN is missing in ~/tetgift/.env"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl -fsS "https://$WEB_DOMAIN/health/ready" >/dev/null; then
              curl -fsS "https://$WEB_DOMAIN/" >/dev/null
              echo "Frontend and backend are healthy: https://$WEB_DOMAIN"
              docker image prune -f >/dev/null
              exit 0
            fi

            echo "Waiting for deployment health check ($attempt/30)..."
            sleep 10
          done

          docker compose --env-file .env --env-file image.env -f docker-compose.prod.yml logs --tail=200
          exit 1
          REMOTE

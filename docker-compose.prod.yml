services:
  tetgift-api:
    image: ${TETGIFT_BE_IMAGE:?TETGIFT_BE_IMAGE is required}
    container_name: tetgift-api
    env_file:
      - .env
    ports:
      - "127.0.0.1:10000:10000"
    init: true
    shm_size: 1gb
    restart: unless-stopped
    networks:
      - tetgift
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  tetgift-web:
    image: ${TETGIFT_FE_IMAGE:?TETGIFT_FE_IMAGE is required}
    container_name: tetgift-web
    ports:
      - "127.0.0.1:3001:80"
    restart: unless-stopped
    networks:
      - tetgift
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  tetgift:

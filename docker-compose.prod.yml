services:
  tetgift-api:
    image: ${TETGIFT_BE_IMAGE:?TETGIFT_BE_IMAGE is required}
    container_name: tetgift-api
    env_file:
      - .env
    expose:
      - "10000"
    init: true
    shm_size: 1gb
    restart: unless-stopped
    networks:
      - tetgift
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  tetgift-web:
    image: ${TETGIFT_FE_IMAGE:?TETGIFT_FE_IMAGE is required}
    container_name: tetgift-web
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - tetgift
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: tetgift-caddy
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tetgift-api
      - tetgift-web
    restart: unless-stopped
    networks:
      - tetgift

networks:
  tetgift:

volumes:
  caddy_data:
  caddy_config:

services:
  tetgift-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:10000"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:10000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

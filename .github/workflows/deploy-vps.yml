name: CI and Deploy TetGift Fullstack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tetgift-production
  cancel-in-progress: true

env:
  APP_DIR: /home/vietanh/tetgift
  BACKEND_IMAGE: tetgift-api
  FRONTEND_IMAGE: tetgift-web
  WEB_DOMAIN: tetgift.khaifrost.com

jobs:
  verify-build-deploy:
    name: Build and deploy TetGift locally
    runs-on:
      - self-hosted
      - Linux
      - X64
    environment:
      name: production
      url: https://tetgift.khaifrost.com

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate production environment secret
        shell: bash
        env:
          VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_ENV_FILE}" ]; then
            echo "Missing GitHub secret: VPS_ENV_FILE"
            exit 1
          fi

          normalized_env="$(printf '%s\n' "${VPS_ENV_FILE}" | tr -d '\r')"
          for name in \
            WEB_DOMAIN \
            ConnectionStrings__DefaultConnection \
            Database__AutoMigrate \
            Jwt__Key \
            Otp__Secret
          do
            value="$(printf '%s\n' "${normalized_env}" | sed -n "s/^${name}=//p" | tail -n 1)"
            if [ -z "${value}" ]; then
              echo "Missing or empty value in VPS_ENV_FILE: ${name}"
              exit 1
            fi
          done

          configured_domain="$(printf '%s\n' "${normalized_env}" | sed -n 's/^WEB_DOMAIN=//p' | tail -n 1)"
          if [ "${configured_domain}" != "${WEB_DOMAIN}" ]; then
            echo "WEB_DOMAIN must be ${WEB_DOMAIN}"
            exit 1
          fi

          auto_migrate="$(printf '%s\n' "${normalized_env}" | sed -n 's/^Database__AutoMigrate=//p' | tail -n 1 | tr '[:upper:]' '[:lower:]')"
          if [ "${auto_migrate}" != "true" ]; then
            echo "Database__AutoMigrate must be true for production deployments"
            exit 1
          fi

          cloudinary_values=0
          for name in \
            CloudinarySettings__CloudName \
            CloudinarySettings__ApiKey \
            CloudinarySettings__ApiSecret
          do
            value="$(printf '%s\n' "${normalized_env}" | sed -n "s/^${name}=//p" | tail -n 1)"
            if [ -n "${value}" ]; then
              cloudinary_values=$((cloudinary_values + 1))
            fi
          done

          if [ "${cloudinary_values}" -ne 0 ] && [ "${cloudinary_values}" -ne 3 ]; then
            echo "Cloudinary settings must either all be set or all be empty"
            exit 1
          fi

      - name: Build backend image
        shell: bash
        run: docker build -t "${BACKEND_IMAGE}:latest" -f BE/Dockerfile BE

      - name: Build frontend image
        shell: bash
        run: docker build -t "${FRONTEND_IMAGE}:latest" -f FE/Dockerfile FE

      - name: Install production environment and Compose file
        shell: bash
        env:
          VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
        run: |
          set -euo pipefail
          install -d -m 700 "${APP_DIR}"

          umask 077
          printf '%s\n' "${VPS_ENV_FILE}" | tr -d '\r' > "${APP_DIR}/.env"
          printf 'TETGIFT_BE_IMAGE=%s\nTETGIFT_FE_IMAGE=%s\n' \
            "${BACKEND_IMAGE}:latest" \
            "${FRONTEND_IMAGE}:latest" \
            > "${APP_DIR}/image.env"

          chmod 600 "${APP_DIR}/.env" "${APP_DIR}/image.env"
          install -m 644 docker-compose.prod.yml "${APP_DIR}/docker-compose.prod.yml"

      - name: Deploy backend and frontend locally
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-directory "${APP_DIR}" \
            --env-file "${APP_DIR}/.env" \
            --env-file "${APP_DIR}/image.env" \
            -f "${APP_DIR}/docker-compose.prod.yml" \
            config > /dev/null

          docker compose \
            --project-directory "${APP_DIR}" \
            --env-file "${APP_DIR}/.env" \
            --env-file "${APP_DIR}/image.env" \
            -f "${APP_DIR}/docker-compose.prod.yml" \
            up -d --force-recreate --remove-orphans

      - name: Check backend health through Nginx
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --header "Host: ${WEB_DOMAIN}" \
              http://127.0.0.1/health/ready > /dev/null
            then
              echo "TetGift API is healthy"
              exit 0
            fi
            echo "Waiting for TetGift API (${attempt}/30)..."
            sleep 10
          done

          docker compose \
            --project-directory "${APP_DIR}" \
            --env-file "${APP_DIR}/.env" \
            --env-file "${APP_DIR}/image.env" \
            -f "${APP_DIR}/docker-compose.prod.yml" \
            logs --tail=200
          exit 1

      - name: Check frontend health through Nginx
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 6 \
            --retry-delay 5 \
            --header "Host: ${WEB_DOMAIN}" \
            http://127.0.0.1/ > /dev/null

      - name: Check public API readiness through Nginx
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/configs /api/products /api/inventories/stocks; do
            curl --fail --silent --show-error \
              --header "Host: ${WEB_DOMAIN}" \
              "http://127.0.0.1${path}" > /dev/null
            echo "TetGift API endpoint is ready: ${path}"
          done

      - name: Show deployment status
        shell: bash
        run: |
          docker compose \
            --project-directory "${APP_DIR}" \
            --env-file "${APP_DIR}/.env" \
            --env-file "${APP_DIR}/image.env" \
            -f "${APP_DIR}/docker-compose.prod.yml" \
            ps
          docker image prune -f
